name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! English or Spanish are both fine (*también en español*).
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: Describe what you want to do or see, and why it would help.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      multiple: true
      options:
        - Overview tab
        - Models tab
        - Projects tab
        - Desktop widget
        - Tray menu
        - Installation / launchers
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Other tools that do something similar, mockups, screenshots…
  - type: checkboxes
    id: rules
    attributes:
      label: Before submitting
      options:
        - label: I checked that there isn't already an issue for this.
          required: true
